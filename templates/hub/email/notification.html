<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #213229; background: #f7f5ed; margin: 0; padding: 0; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #fffefa; border: 1px solid #d8d9ce; border-radius: 8px; padding: 36px; }
    .brand { font-size: 22px; font-weight: 700; color: #265c45; margin-bottom: 24px; }
    .brand span { color: #213229; }
    .message { font-size: 16px; line-height: 1.6; margin-bottom: 24px; }
    .button { display: inline-block; background: #265c45; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 4px; font-weight: 700; font-size: 14px; }
    .footer { text-align: center; color: #64716a; font-size: 12px; margin-top: 32px; padding-top: 16px; border-top: 1px solid #d8d9ce; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand"><span>Study</span>Sphere</div>
    <p class="message">Hi {{ username }},</p>
    <p class="message">{{ text }}</p>
    {% if link %}
    <p><a class="button" href="{{ link }}">View on StudySphere</a></p>
    {% endif %}
    <div class="footer">
      <p>{{ site_name }} · You're receiving this because email notifications are enabled on your profile.</p>
    </div>
  </div>
</body>
</html>
