{% extends 'base.html' %}
{% block title %}Set New Password | StudySphere{% endblock %}
{% block content %}
<section class="form-card narrow">
  <p class="eyebrow">STEP 3 OF 3 · SET NEW PASSWORD</p>
  <h1>Create new password</h1>
  <p class="subtle" style="margin-top:0">OTP verified for <b>@{{ reset_user.username }}</b>. Enter your new password below.</p>
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="password1">New password</label>
      <input id="password1" type="password" name="password1" minlength="6" placeholder="At least 6 characters" required>
    </p>
    <p>
      <label for="password2">Confirm new password</label>
      <input id="password2" type="password" name="password2" minlength="6" placeholder="Re-enter your new password" required>
    </p>
    <button class="button" type="submit">Reset Password &amp; Sign In →</button>
  </form>
</section>
{% endblock %}
