{% extends 'base.html' %}
{% block title %}Set New Password | StudySphere{% endblock %}
{% block content %}
<div class="auth-stage">
  <div class="auth-orb auth-orb-1" aria-hidden="true"></div>
  <div class="auth-orb auth-orb-2" aria-hidden="true"></div>

  <section class="auth-card">
    <div class="auth-card-accent" aria-hidden="true"></div>

    <div class="auth-header">
      <p class="eyebrow" style="margin-bottom:4px">STEP 3 OF 3 · SET NEW PASSWORD</p>
      <h1>Create new password</h1>
      <p class="auth-subtitle">OTP verified for <b>@{{ reset_user.username }}</b>.</p>
    </div>

    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="auth-field">
        <label for="password1">New password</label>
        <input id="password1" type="password" name="password1" placeholder="Enter new password" required>
      </div>
      <div class="auth-field">
        <label for="password2">Confirm new password</label>
        <input id="password2" type="password" name="password2" placeholder="Confirm new password" required>
      </div>
      <button class="auth-submit-btn" type="submit">
        <span>Reset Password &amp; Sign In</span>
        <span aria-hidden="true">→</span>
      </button>
    </form>
  </section>
</div>
{% endblock %}
