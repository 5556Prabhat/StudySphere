{% extends 'base.html' %}
{% block title %}Sign in | StudySphere{% endblock %}
{% block content %}
<section class="form-card narrow">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <button class="button" type="submit">Sign in</button>
      <a href="{% url 'forgot_password' %}" style="font-size:13.5px;font-weight:600">Forgot password? (Email OTP) →</a>
    </div>
  </form>
  <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
  <p style="margin:0">New here? <a href="{% url 'signup' %}">Create a free account</a></p>
</section>
{% endblock %}
